name: Publish to PyPI

# Builds and publishes carterkit to PyPI on a version tag (vX.Y.Z) using PyPI
# Trusted Publishing (OIDC) — no API token stored anywhere.
#
# Supply-chain posture:
#   * every action is pinned to a commit SHA (the tag comment says which release);
#   * the test job must pass on the tagged commit before anything is built;
#   * publishing runs in the `pypi` GitHub environment — configure it with a required
#     reviewer so a tag push alone cannot publish (Settings → Environments → pypi);
#   * the sdist/wheel are built once and the exact artifacts are what gets published.
#
# One-time setup at https://pypi.org/manage/account/publishing/ (pending publisher):
#   PyPI project name: carterkit
#   Owner:             Mariner10
#   Repository:        carterkit
#   Workflow name:     publish.yml
#   Environment:       pypi
#
# Release:  git tag v0.12.0 && git push origin v0.12.0   (then approve the `pypi` run)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade "pip<26"
          python -m pip install -e . "pytest>=8,<10"
      - name: Tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$tag" = "$ver" || { echo "tag v$tag != pyproject $ver"; exit 1; }
      - name: Test
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade "pip<26"
          python -m pip install "build>=1.2,<2"
          python -m build
      - name: Check the sdist ships no tests
        run: |
          tar tzf dist/*.tar.gz | grep -E '(^|/)tests/' && { echo "tests/ leaked into sdist"; exit 1; } || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # protected: required reviewer approves the release
    permissions:
      id-token: write          # required for OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (2026-09-22)
