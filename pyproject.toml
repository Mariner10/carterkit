[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carterkit"
version = "0.12.0"
description = "Build and drive CAR-TER layouts from Python — the control docs are the library."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carter Beaudoin" }]
keywords = ["car-ter", "carter", "iot", "dashboard", "remote", "meshsocket", "layout"]
dependencies = [
    # Upper bounds: both are security-relevant and their majors have broken us before.
    # 0.2.0 (identify-after-auth closes, name validation) is being prepared; widen the
    # floor to >=0.2.0 once it is on PyPI.
    "meshsocket>=0.1.2,<0.3",
    "cryptography>=42,<50",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Framework :: AsyncIO",
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Mariner10/carterkit"
Repository = "https://github.com/Mariner10/carterkit"

[project.scripts]
carterkit = "carterkit.cli:main"

[tool.setuptools]
packages = ["carterkit"]

[tool.setuptools.package-data]
carterkit = ["controldocs/*.md", "py.typed"]
